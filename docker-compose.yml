version: '3.9'

services:
  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/escrowflow
      RUST_LOG: info
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: escrowflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
