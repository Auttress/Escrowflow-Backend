[package]
name = "escrowflow_backend"
version = "0.1.0"
edition = "2021"
authors = ["EscrowFlow Team <team@escrowflow.com>"]
description = "Backend API for EscrowFlow — freelance escrow platform powered by Stellar and Soroban smart contracts."
license = "MIT"
repository = "https://github.com/Auttress/Escrowflow-Backend"
readme = "README.md"

[dependencies]
axum = { version = "0.7", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.4", features = ["cors", "trace"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "macros", "uuid", "chrono"] }
dotenvy = "0.15"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
anyhow = "1.0"

[profile.release]
opt-level = 3

[package.metadata]
# Local tooling can use this path for SQLx migrations
sqlx = { "migrations-dir" = "migrations" }
